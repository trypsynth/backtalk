name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The full history gives the build number (the commit count) and the release notes.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Caches Gradle and validates the wrapper jar checksum.
      - uses: gradle/actions/setup-gradle@v6

      # Signs builds with the same debug key as the maintainer's own builds, so that installed
      # development builds can update in place. Pull requests from forks do not get the secret,
      # so they are signed with a new debug key.
      - name: Install debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore
            echo "Installed the debug keystore."
          else
            echo "No debug keystore secret, so the build uses a new debug key."
          fi

      # AGP downloads the SDK platform and NDK it needs if the runner lacks them.
      - name: Build debug APKs
        run: ./gradlew assembleDebug --console=plain

      # Only the phone flavor: the watch's braille keyboard is a stub, so the braille keyboard's
      # tests don't compile for it, and the rest of the code is shared.
      - name: Run unit tests
        run: ./gradlew testPhoneDebugUnitTest --console=plain

      # The app's lint also checks the library modules. Issues already in lint-baseline.xml are
      # allowed, so this fails only on new errors, such as a call that needs a newer Android than
      # minSdk without a version check. The watch is linted too: it has code of its own and a
      # higher minSdk, and the baseline covers both.
      - name: Run lint
        run: ./gradlew :lintPhoneDebug :lintWearDebug --console=plain

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            build/reports/lint-results-phoneDebug.html
            build/reports/lint-results-wearDebug.html

      # The phone build with ML Kit's text recognition model, for phones without Google Play
      # services. It is built last, so that the tests and lint above check the usual build, and
      # the usual phone APK is kept aside while it is built in the same place.
      - name: Build the APK without Play services
        run: |
          cp build/outputs/apk/phone/debug/backtalk-phone-debug.apk "$RUNNER_TEMP/"
          ./gradlew :assemblePhoneDebug -PbundledOcr --console=plain
          mkdir -p build/outputs/apk/nogms
          mv build/outputs/apk/phone/debug/backtalk-phone-debug.apk build/outputs/apk/nogms/backtalk-nogms-debug.apk
          cp "$RUNNER_TEMP/backtalk-phone-debug.apk" build/outputs/apk/phone/debug/

      - uses: actions/upload-artifact@v7
        with:
          name: apks
          path: build/outputs/apk/**/*.apk
          if-no-files-found: error

  # Replaces the rolling "dev" pre-release that the in-app updater checks. The first line of the
  # notes is "build: <commit count>", and each later line is "- <short hash> <subject>", newest
  # first. The "latest" pre-release stays frozen on the last build with the old app ID,
  # com.android.talkback, which moves people on older builds to this one with their settings.
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: apks
          path: apks

      - name: Publish development build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          offset=$(awk '/^def buildNumberOffset = /{print $4}' version.gradle)
          count=$(( $(git rev-list --count HEAD) + offset ))
          hash=$(git rev-parse HEAD)
          short=${hash:0:7}
          {
            echo "build: $count"
            echo
            # %H cut to 7 characters, since %h can be longer when a short hash is ambiguous.
            git log -n 100 --format='%H %s' HEAD | while IFS= read -r line; do
              echo "- ${line:0:7} ${line:41}"
            done
          } > release-notes.md
          # The phone build is backtalk.apk, which the updater on phones looks for, the watch build
          # is backtalk-wear.apk, which the updater on watches looks for, and the phone build
          # without Play services is backtalk-nogms.apk, which its own updater looks for.
          for build in phone:backtalk.apk wear:backtalk-wear.apk nogms:backtalk-nogms.apk; do
            apk=$(find apks -name "backtalk-${build%%:*}-debug.apk" | head -n 1)
            if [ -z "$apk" ]; then
              echo "The ${build%%:*} APK was not found." >&2
              exit 1
            fi
            cp "$apk" "${build#*:}"
          done
          title="Development build $count ($short)"
          tag=dev
          if gh release view "$tag" > /dev/null 2>&1; then
            # Update the release in place. Deleting and creating it again counts as a new release,
            # which notifies everyone watching the repository.
            git tag -f "$tag" "$GITHUB_SHA"
            git push -f origin "refs/tags/$tag"
            gh release upload "$tag" backtalk.apk backtalk-wear.apk backtalk-nogms.apk --clobber
            gh release edit "$tag" --title "$title" --notes-file release-notes.md --prerelease
          else
            gh release create "$tag" backtalk.apk backtalk-wear.apk backtalk-nogms.apk --prerelease --target "$GITHUB_SHA" --title "$title" --notes-file release-notes.md
          fi
